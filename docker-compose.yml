# Full NONO stack. Clone the three repos side by side, then from this folder:
#   docker compose up --build      →  http://localhost:5173
services:
  rag:
    build: ../ai_jarvis_assistant_rag_agent
    env_file: ../ai_jarvis_assistant_rag_agent/.env
    environment:
      NONO_DATA_DIR: /data
    volumes:
      - nono-brain:/data
    ports: ["8100:8100"]
    restart: unless-stopped
  backend:
    build: .
    env_file: .env
    environment:
      RAG_URL: http://rag:8100
      NONO_DATA_DIR: /data
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - nono-data:/data
    ports: ["8000:8000"]
    depends_on: [rag]
    restart: unless-stopped
  frontend:
    build:
      context: ../ai_jarvis_assistant_frontend
    ports: ["5173:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  nono-brain:
  nono-data:
